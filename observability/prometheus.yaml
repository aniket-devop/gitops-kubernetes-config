apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.observability.svc.cluster.local:9093"]
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: "jaeger"
        static_configs:
          - targets: ["jaeger.observability.svc.cluster.local:14269"]
      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector.observability.svc.cluster.local:8889"]
  rules.yml: |
    groups:
      - name: gitops-demo-alerts
        rules:
          - alert: HighErrorRate
            expr: (sum(rate(traces_span_metrics_calls_total{service_name="gitops-demo-app",span_kind="SPAN_KIND_SERVER",http_status_code=~"5.."}[5m])) or vector(0)) / sum(rate(traces_span_metrics_calls_total{service_name="gitops-demo-app",span_kind="SPAN_KIND_SERVER"}[5m])) > 500.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Error rate above 5% on gitops-demo-app"
          - alert: HighLatency
            expr: histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="gitops-demo-app",span_kind="SPAN_KIND_SERVER"}[5m]))) > 500
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "p95 latency above 500ms on gitops-demo-app"
          - alert: ServiceUnavailable
            expr: absent(rate(traces_span_metrics_calls_total{service_name="gitops-demo-app",span_kind="SPAN_KIND_SERVER"}[5m]) > 500)
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "No traffic observed for gitops-demo-app"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
